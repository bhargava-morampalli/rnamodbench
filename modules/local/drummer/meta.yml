---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: drummer
description: Detect RNA modifications at nucleotide-level resolution through comparative
  analysis of basecall errors
keywords:
  - rna modification
  - m6A
  - nanopore
  - direct rna sequencing
  - basecall errors
  - isoform analysis
tools:
  - drummer:
      description: Detection of RNA modifications in nanopore direct RNA sequencing
        datasets
      homepage: https://github.com/DepledgeLab/DRUMMER
      documentation: https://github.com/DepledgeLab/DRUMMER/blob/master/README.md
      licence: ["MIT"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', rrna:'16s', replicate:'rep1' ]
    - native_bam:
        type: file
        description: Sorted BAM file from native RNA sample (modifications present)
        pattern: "*.bam"
    - native_bai:
        type: file
        description: BAM index file for native sample
        pattern: "*.bai"
    - ivt_bam:
        type: file
        description: Sorted BAM file from IVT (control, modifications absent) sample
        pattern: "*.bam"
    - ivt_bai:
        type: file
        description: BAM index file for IVT sample
        pattern: "*.bai"
    - reference:
        type: file
        description: Reference FASTA file
        pattern: "*.{fa,fasta}"
output:
  results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', rrna:'16s', replicate:'rep1' ]
      - ${prefix}:
          type: directory
          description: Directory containing DRUMMER results including summary.txt
            with candidate modification sites
          pattern: "*_drummer"
  log:
    - - '*.log':
          type: file
          description: Log file
          pattern: '*.log'
  versions_drummer:
    - - ${task.process}:
          type: string
          description: The name of the process
      - drummer:
          type: string
          description: The name of the tool
      - python -c 'import importlib.metadata as m; print(m.version("drummer"))' 2>/dev/null || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version 2>&1 | sed 's/Python //' || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - drummer:
          type: string
          description: The name of the tool
      - python -c 'import importlib.metadata as m; print(m.version("drummer"))' 2>/dev/null || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version 2>&1 | sed 's/Python //' || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@bmorampa"
maintainers:
  - "@bmorampa"
