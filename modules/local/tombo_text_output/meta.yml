---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "tombo_text_output"
description: Convert Tombo statistics to text/CSV format for downstream analysis
keywords:
  - tombo
  - statistics
  - text
  - csv
  - nanopore
  - modifications
tools:
  - tombo:
      description: |
        Tombo is a suite of tools primarily for the identification of modified nucleotides
        from raw nanopore sequencing data. This module exports Tombo statistics to
        tab-delimited text format for easier parsing and visualization.
      homepage: https://github.com/nanoporetech/tombo
      documentation: https://nanoporetech.github.io/tombo/
      tool_dev_url: https://github.com/nanoporetech/tombo
      licence: ["mpl-2.0"]

input:
  - - key:
        type: string
        description: Sample identifier/key (should include rRNA type prefix like
          '16s' or '23s')
    - statistic:
        type: file
        description: Tombo statistics file from detect_modifications
        pattern: "*.tombo.stats"
    - reference:
        type: file
        description: reference file
output:
  csv:
    - - key:
          type: string
          description: Sample identifier/key
      - '*.csv':
          type: file
          description: csv output file
          pattern: '*.csv'
  log:
    - - '*.log':
          type: file
          description: Log file
          pattern: '*.log'
  versions_tombo:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tombo:
          type: string
          description: The name of the tool
      - tombo --version 2>&1 | grep -oP '[0-9]+\\.[0-9]+[0-9.]*' | head -1 || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
  versions_pandas:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pandas:
          type: string
          description: The name of the tool
      - python -c 'import pandas; print(pandas.__version__)' 2>/dev/null || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tombo:
          type: string
          description: The name of the tool
      - tombo --version 2>&1 | grep -oP '[0-9]+\\.[0-9]+[0-9.]*' | head -1 || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - pandas:
          type: string
          description: The name of the tool
      - python -c 'import pandas; print(pandas.__version__)' 2>/dev/null || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@bhargava-morampalli"
maintainers:
  - "@bhargava-morampalli"
