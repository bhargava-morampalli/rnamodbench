---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "yanocomp_analysis"
description: Compare native and IVT samples using yanocomp GMM test to detect RNA
  modifications
keywords:
  - nanopore
  - rna-modifications
  - modification-detection
  - gmm
  - statistical-testing
  - native-vs-ivt
tools:
  - yanocomp:
      description: Yet Another Nanopore COMParison tool for detecting RNA modifications
      homepage: https://github.com/baraaorabi/yanocomp
      documentation: https://github.com/baraaorabi/yanocomp
      tool_dev_url: https://github.com/baraaorabi/yanocomp
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - hdf5_native:
        type: file
        description: HDF5 file from yanocomp_prepare containing native sample data
        pattern: "*.hdf5"
    - hdf5_ivt:
        type: file
        description: HDF5 file from yanocomp_prepare containing in vitro transcribed
          (IVT) sample data
        pattern: "*.hdf5"
output:
  bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - '*.bed':
          type: file
          description: BED file with detected modification sites and statistics
          pattern: "*.bed"
  json:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - '*_sm_preds.json':
          type: file
          description: JSON file with per-site statistical model predictions
          pattern: "*_sm_preds.json"
  log:
    - - '*.log':
          type: file
          description: Log file
          pattern: '*.log'
  versions_yanocomp:
    - - ${task.process}:
          type: string
          description: The name of the process
      - yanocomp:
          type: string
          description: The name of the tool
      - yanocomp --version 2>/dev/null | grep -oP '[0-9]+\\.[0-9]+[0-9.]*' | head -1 || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - yanocomp:
          type: string
          description: The name of the tool
      - yanocomp --version 2>/dev/null | grep -oP '[0-9]+\\.[0-9]+[0-9.]*' | head -1 || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@bhargava-morampalli"
maintainers:
  - "@bhargava-morampalli"
