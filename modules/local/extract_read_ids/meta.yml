---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "extract_read_ids"
description: Extract read IDs from Nanopore FASTQ files using seqkit
keywords:
  - nanopore
  - long-read
  - fastq
  - read-ids
  - seqkit
tools:
  - seqkit:
      description: A cross-platform and ultrafast toolkit for FASTA/Q file manipulation
      homepage: https://bioinf.shenwei.me/seqkit/
      documentation: https://bioinf.shenwei.me/seqkit/
      tool_dev_url: https://github.com/shenwei356/seqkit
      licence: MIT

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - fastq:
        type: file
        description: Input Nanopore FASTQ file
        pattern: "*.{fastq,fq,fastq.gz,fq.gz}"
output:
  read_ids:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - '*.read_ids.txt':
          type: file
          description: Text file containing extracted read IDs
          pattern: "*.read_ids.txt"
  versions_seqkit:
    - - ${task.process}:
          type: string
          description: The name of the process
      - seqkit:
          type: string
          description: The name of the tool
      - seqkit version | sed 's/seqkit version //' || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - seqkit:
          type: string
          description: The name of the tool
      - seqkit version | sed 's/seqkit version //' || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@bhargava-morampalli"
maintainers:
  - "@bhargava-morampalli"
