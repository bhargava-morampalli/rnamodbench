---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: jacusa2
description: Detect RNA modifications by scoring mismatches and INDELs between native
  and control samples using JACUSA2
keywords:
  - rna modification
  - m6A
  - nanopore
  - direct rna sequencing
  - snv detection
  - mismatch analysis
tools:
  - jacusa2:
      description: JAVA framework for accurate SNV assessment and RNA modification
        detection
      homepage: https://github.com/dieterich-lab/JACUSA2
      documentation: https://github.com/dieterich-lab/JACUSA2/blob/master/README.md
      licence: ["GPL-3.0"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', rrna:'16s', replicate:'rep1' ]
    - native_bam:
        type: file
        description: Sorted BAM file from native RNA sample (modified)
        pattern: "*.bam"
    - native_bai:
        type: file
        description: BAM index file for native sample
        pattern: "*.bai"
    - ivt_bam:
        type: file
        description: Sorted BAM file from IVT (control/unmodified) sample
        pattern: "*.bam"
    - ivt_bai:
        type: file
        description: BAM index file for IVT sample
        pattern: "*.bai"
    - reference:
        type: file
        description: Reference FASTA file
        pattern: "*.{fa,fasta}"
output:
  bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', rrna:'16s', replicate:'rep1' ]
      - ${prefix}.bed:
          type: file
          description: BED-like file with variant calls and scores for modification
            detection
          pattern: "*_jacusa2.bed"
  log:
    - - '*.log':
          type: file
          description: Log file
          pattern: '*.log'
  versions_jacusa2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - jacusa2:
          type: string
          description: The name of the tool
      - 2.0.4:
          type: string
          description: The version of the tool
  versions_java:
    - - ${task.process}:
          type: string
          description: The name of the process
      - java:
          type: string
          description: The name of the tool
      - java -version 2>&1 | head -1 | sed 's/.*version "\\([^"]*\\)".*/\\1/' || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - jacusa2:
          type: string
          description: The name of the tool
      - 2.0.4:
          type: string
          description: The version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - java:
          type: string
          description: The name of the tool
      - java -version 2>&1 | head -1 | sed 's/.*version "\\([^"]*\\)".*/\\1/' || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@bmorampa"
maintainers:
  - "@bmorampa"
