---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "multi_to_single_fast5"
description: Convert multi-read fast5 files to single-read fast5 files
keywords:
  - nanopore
  - fast5
  - conversion
  - multi-read
  - single-read
  - oxford nanopore
  - ont
tools:
  - ont-fast5-api:
      description: |
        Oxford Nanopore Technologies fast5 API software.
        A simple interface to HDF5 files of the Oxford Nanopore .fast5 file format.
        The multi_to_single_fast5 tool converts multi-read fast5 files into single-read fast5 files,
        which is required for certain downstream analysis tools.
      homepage: https://github.com/nanoporetech/ont_fast5_api
      documentation: https://github.com/nanoporetech/ont_fast5_api/blob/master/README.rst
      licence: ["MPL-2.0"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - fast5_dir:
        type: directory
        description: Directory containing multi-read fast5 files
        pattern: "*"
output:
  fast5:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - single_fast5_*:
          type: directory
          description: Directory containing single-read fast5 files
          pattern: "single_fast5"
  versions_ont_fast5_api:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ont-fast5-api:
          type: string
          description: The name of the tool
      - multi_to_single_fast5 --version 2>&1 | grep -oP '[0-9]+\\.[0-9]+[0-9.]*' | head -1 || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ont-fast5-api:
          type: string
          description: The name of the tool
      - multi_to_single_fast5 --version 2>&1 | grep -oP '[0-9]+\\.[0-9]+[0-9.]*' | head -1 || echo unknown:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@bhargava-morampalli"
maintainers:
  - "@bhargava-morampalli"
